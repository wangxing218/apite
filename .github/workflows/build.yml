name: 构建发布

on:
  workflow_dispatch:
    inputs:
      mark:
        description: 发布说明
        required: true
        default: ''
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: 构建发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4
        with:
          version: 7

      - run: |
          echo "发布说明: ${{ github.event.inputs.mark }}"
      - run: |
          cd web-src
          pnpm install
          npm run build
          cd ..
          npm publish
